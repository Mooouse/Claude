name: Import complete Infinity Space repository
on:
  push:
    paths:
      - '.github/workflows/import-infinity-space.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy every file including original music and covers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch main https://github.com/Mooouse/Infinity-Space.git "$RUNNER_TEMP/infinity-space-source"
          source_dir="$RUNNER_TEMP/infinity-space-source"
          test -s "$source_dir/index.html"
          test -s "$source_dir/cosmic-worms.js"
          test -s "$source_dir/assets/music/track-01.mp3"
          test "$(find "$source_dir/assets/music" -type f -name '*.mp3' | wc -l)" -eq 12
          # Preserve original files exactly, including dotfiles, workflows and binary tracks.
          rsync -a --delete --exclude='/.git/' "$source_dir/" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Copy complete Infinity Space game, assets, tests and workflows'
          git push origin HEAD:main
          echo 'Source tracked files:'
          git -C "$source_dir" ls-files | wc -l
          echo 'Destination tracked files:'
          git ls-files | wc -l
